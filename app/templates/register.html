{% extends "base.html" %}

{% block title %}
Register · PocketSmart AI
{% endblock %}


{% block content %}

<section class="auth-wrap">

  <form
    id="register-form"
    class="form-card"
  >

    <p class="eyebrow">
      POCKETSMART AI
    </p>

    <h1>
      Create your account
    </h1>


    <label>

      Name

      <input
        name="name"
        required
        minlength="2"
      >

    </label>


    <label>

      Email

      <input
        name="email"
        type="email"
        required
      >

    </label>


    <label>

      Password

      <input
        name="password"
        type="password"
        required
        minlength="8"
      >

    </label>


    <button
      class="button primary"
      type="submit"
    >
      Create Account
    </button>


    <p
      id="form-message"
      class="message"
    ></p>


    <p>

      Already registered?

      <a href="/login">
        Login
      </a>.

    </p>

  </form>

</section>

{% endblock %}
